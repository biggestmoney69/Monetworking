<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monetworking — live impressionism</title>
<meta name="description" content="Turns your camera into a live Monet-style impressionist painting, right in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d9b865'/%3E%3Ccircle cx='12' cy='13' r='4' fill='%236a7fb5'/%3E%3Ccircle cx='20' cy='12' r='3.4' fill='%23e08c9d'/%3E%3Ccircle cx='19' cy='20' r='3.8' fill='%237fae8d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wall">
  <header class="masthead">
    <h1>Monetworking</h1>
    <p>live impressionism &mdash; your camera, painted</p>
  </header>

  <div class="stage">
    <section class="easel">
      <div class="frame" id="frame">
        <div class="liner">
          <div class="hold" id="hold"><canvas id="view" width="16" height="12"></canvas></div>
          <div class="overlay" id="overlay">
            <p id="overlay-msg"></p>
          </div>
          <div class="toast" id="toast"></div>
        </div>
      </div>
      <div class="plaque">
        <strong>Live Impression</strong>
        <span>after Claude Monet &middot; painted in real time by your GPU</span>
      </div>
    </section>

    <aside class="placard">
      <h2>The painter&rsquo;s palette</h2>

      <div class="slider">
        <label for="s-brush"><span>Brush size</span><output id="o-brush"></output></label>
        <input type="range" id="s-brush" min="2" max="8" step="0.5" value="5"
               title="Breadth of each brush stroke">
      </div>
      <div class="slider">
        <label for="s-q"><span>Stroke definition</span><output id="o-q"></output></label>
        <input type="range" id="s-q" min="2" max="18" step="0.5" value="8"
               title="How crisply strokes separate from each other">
      </div>
      <div class="slider">
        <label for="s-wet"><span>Wet paint</span><output id="o-wet"></output></label>
        <input type="range" id="s-wet" min="0" max="0.92" step="0.01" value="0.45"
               title="Lets each frame bleed into the next, calming flicker">
      </div>
      <div class="slider">
        <label for="s-dream"><span>Dreaminess</span><output id="o-dream"></output></label>
        <input type="range" id="s-dream" min="0" max="1" step="0.01" value="0.55"
               title="Pastel grade: cool lifted shadows, creamy highlights">
      </div>
      <div class="slider">
        <label for="s-warm"><span>Warmth</span><output id="o-warm"></output></label>
        <input type="range" id="s-warm" min="0" max="1" step="0.01" value="0.6"
               title="Cool morning light to warm sunset light">
      </div>
      <div class="slider">
        <label for="s-weave"><span>Canvas weave</span><output id="o-weave"></output></label>
        <input type="range" id="s-weave" min="0" max="1" step="0.01" value="0.55"
               title="How much the linen texture shows through">
      </div>
      <div class="slider">
        <label for="s-relief"><span>Impasto relief</span><output id="o-relief"></output></label>
        <input type="range" id="s-relief" min="0" max="1" step="0.01" value="0.55"
               title="Thick-paint lighting on stroke edges">
      </div>

      <div class="buttons">
        <button id="b-flip" title="Switch between front and rear cameras">Flip camera</button>
        <button id="b-pause" title="Freeze the painting; grade sliders stay live">Pause</button>
        <button id="b-save" title="Download the current painting as a PNG">Save painting</button>
        <button id="b-demo" title="Paint a procedural water-lily garden instead">Demo scene</button>
      </div>

      <footer>
        <span id="meta"></span>
        <span id="fps"></span>
      </footer>
    </aside>
  </div>
</main>
<script src="shaders.js"></script>
<script src="app.js"></script>
</body>
</html>
